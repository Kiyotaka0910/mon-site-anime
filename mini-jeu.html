<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Jeu Otaku - Mode Infini</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #06070c;
            --panel-bg: rgba(18, 20, 32, 0.85);
            --blue-neon: #2e90ff;
            --pink-neon: #ff4757;
            --green-neon: #2ed573;
            --text-main: #ffffff;
            --text-sub: #a4b0be;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(46, 144, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 71, 87, 0.15) 0%, transparent 40%);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
            text-align: center;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            margin-bottom: 20px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.06);
            padding: 10px 22px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .back-button:hover {
            background: var(--blue-neon);
            border-color: var(--blue-neon);
            transform: translateX(-5px);
            box-shadow: 0 5px 20px rgba(46, 144, 255, 0.4);
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, var(--blue-neon), #ffffff, var(--pink-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        p.subtitle {
            color: var(--text-sub);
            margin-bottom: 25px;
            font-size: 1.05rem;
        }

        /* Barre d'informations */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 25px;
            border-radius: 50px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            font-size: 0.95rem;
        }

        .stat-val {
            font-weight: 900;
            color: var(--blue-neon);
        }

        /* Carte de Jeu */
        .quiz-card {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 35px 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        .question-category {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(46, 144, 255, 0.2);
            color: var(--blue-neon);
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 30px;
            line-height: 1.4;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Grille des réponses */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        .opt-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: white;
            padding: 16px;
            border-radius: 16px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
        }

        .opt-btn:hover {
            background: rgba(46, 144, 255, 0.2);
            border-color: var(--blue-neon);
            transform: translateY(-3px);
        }

        .opt-btn.correct {
            background: rgba(46, 213, 115, 0.3) !important;
            border-color: var(--green-neon) !important;
            color: var(--green-neon) !important;
        }

        .opt-btn.wrong {
            background: rgba(255, 71, 87, 0.3) !important;
            border-color: var(--pink-neon) !important;
            color: var(--pink-neon) !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-button">← Retour à l'accueil</a>

        <h1>Devine l'Animé ! 🎮</h1>
        <p class="subtitle">Mode Infini ♾️ — Teste tes limites Otaku sans interruption !</p>

        <div class="stats-bar">
            <div>Score : <span id="scoreVal" class="stat-val">0</span></div>
            <div>Questions jouées : <span id="qCount" class="stat-val">0</span></div>
            <div>Série : <span id="streakVal" class="stat-val">0 🔥</span></div>
        </div>

        <div class="quiz-card" id="quizCard">
            <span id="qCategory" class="question-category">Émojis</span>
            <div id="qText" class="question-text">Chargement de la question...</div>

            <div class="options-grid" id="optionsGrid">
                </div>
        </div>
    </div>

    <script>
        /* ==============================================
           BANQUE DE QUESTIONS OTAKU
        ============================================== */
        const questionsDatabase = [
            {
                type: "Émojis 🧩",
                question: "Devine l'animé : 📓 🖊️ 👁️ 🍎",
                options: ["Death Note", "Jujutsu Kaisen", "Bleach", "Code Geass"],
                answer: 0
            },
            {
                type: "Citation 💬",
                question: "« S'il n'y a plus de place en enfer, les démons marcheront sur terre. »",
                options: ["Chainsaw Man", "Berserk", "Tokyo Ghoul", "Demon Slayer"],
                answer: 1
            },
            {
                type: "Émojis 🧩",
                question: "Devine l'animé : 🏴‍☠️ 👒 🍖 🌊",
                options: ["Naruto", "One Piece", "Hunter x Hunter", "Fairy Tail"],
                answer: 1
            },
            {
                type: "Indice 🔍",
                question: "L'histoire tourne autour d'un alchimiste qui cherche la Pierre Philosophale.",
                options: ["Steins;Gate", "Soul Eater", "Fullmetal Alchemist", "Black Clover"],
                answer: 2
            },
            {
                type: "Citation 💬",
                question: "« Je serai le dieu de ce nouveau monde ! »",
                options: ["Lelouch (Code Geass)", "Light Yagami (Death Note)", "Aizen (Bleach)", "Sukuna (JJK)"],
                answer: 1
            },
            {
                type: "Émojis 🧩",
                question: "Devine l'animé : 🧱 ⚔️ 🛡️ 🩸 👑",
                options: ["Vinland Saga", "Attack on Titan", "Kingdom", "Overlord"],
                answer: 1
            },
            {
                type: "Indice 🔍",
                question: "Un lycéen se fait renverser par un camion et se réincarne dans un monde fantasy.",
                options: ["Re:Zero", "Konosuba", "Solo Leveling", "Isekai classique"],
                answer: 3
            },
            {
                type: "Émojis 🧩",
                question: "Devine l'animé : 👁️ 🟣 🖐️ 🏫",
                options: ["Jujutsu Kaisen", "Mob Psycho 100", "My Hero Academia", "Parasyte"],
                answer: 0
            },
            {
                type: "Citation 💬",
                question: "« Dans ce monde, ceux qui enfreignent les règles sont des déchets, mais ceux qui abandonnent leurs amis sont pires que ça. »",
                options: ["Naruto", "Dragon Ball", "Hunter x Hunter", "Bleach"],
                answer: 0
            },
            {
                type: "Indice 🔍",
                question: "Quel animé possède l'opening ultra-célèbre 'Unravel' ?",
                options: ["Parasyte", "Tokyo Ghoul", "Psycho-Pass", "Another"],
                answer: 1
            },
            {
                type: "Émojis 🧩",
                question: "Devine l'animé : 🗡️ 🐗 ⚡ 🎋 👺",
                options: ["Demon Slayer", "Inuyasha", "Dororo", "Gintama"],
                answer: 0
            },
            {
                type: "Citation 💬",
                question: "« Bankai ! »",
                options: ["One Piece", "Bleach", "Naruto", "Dragon Ball Z"],
                answer: 1
            },
            {
                type: "Émojis 🧩",
                question: "Devine l'animé : 👨‍👩‍👧 🕵️‍♂️ 👩‍🍳 🥜",
                options: ["Spy x Family", "Kaguya-sama", "Clannad", "Toradora"],
                answer: 0
            },
            {
                type: "Indice 🔍",
                question: "Un livre magique qui permet d'invoquer un grimoire à 5 trèfles.",
                options: ["Fairy Tail", "Black Clover", "Magi", "Radiant"],
                answer: 1
            },
            {
                type: "Citation 💬",
                question: "« Plus Ultra ! »",
                options: ["One Punch Man", "My Hero Academia", "Dragon Ball Super", "Solo Leveling"],
                answer: 1
            }
        ];

        let questionsAnswered = 0;
        let score = 0;
        let streak = 0;
        let pool = [];
        let currentQuestion = null;
        let canAnswer = true;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(isCorrect) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';

                if (isCorrect) {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
                } else {
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.2);
                }

                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch(e){}
        }

        // Récupère une question en évitant les répétitions
        function getNextQuestion() {
            if (pool.length === 0) {
                pool = [...questionsDatabase].sort(() => Math.random() - 0.5);
            }
            return pool.pop();
        }

        function loadQuestion() {
            canAnswer = true;
            currentQuestion = getNextQuestion();

            document.getElementById("qCategory").innerText = currentQuestion.type;
            document.getElementById("qText").innerText = currentQuestion.question;
            
            const grid = document.getElementById("optionsGrid");
            grid.innerHTML = "";

            currentQuestion.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "opt-btn";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(selectedIdx, btnElement) {
            if (!canAnswer) return;
            canAnswer = false;

            const buttons = document.querySelectorAll(".opt-btn");
            questionsAnswered++;

            if (selectedIdx === currentQuestion.answer) {
                btnElement.classList.add("correct");
                score += 100 + (streak * 20);
                streak++;
                playSound(true);
            } else {
                btnElement.classList.add("wrong");
                buttons[currentQuestion.answer].classList.add("correct");
                streak = 0;
                playSound(false);
            }

            updateStats();

            setTimeout(() => {
                loadQuestion();
            }, 1000);
        }

        function updateStats() {
            document.getElementById("scoreVal").innerText = score;
            document.getElementById("qCount").innerText = questionsAnswered;
            document.getElementById("streakVal").innerText = `${streak} 🔥`;
        }

        // Lancement initial du mode infini
        loadQuestion();
    </script>
</body>
</html>
