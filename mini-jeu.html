<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Jeu Otaku - Mode Hardcore Infini</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #06070c;
            --panel-bg: rgba(18, 20, 32, 0.85);
            --blue-neon: #2e90ff;
            --pink-neon: #ff4757;
            --purple-neon: #a55eea;
            --green-neon: #2ed573;
            --text-main: #ffffff;
            --text-sub: #a4b0be;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(165, 94, 234, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 71, 87, 0.18) 0%, transparent 40%);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
            text-align: center;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            margin-bottom: 20px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.06);
            padding: 10px 22px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .back-button:hover {
            background: var(--purple-neon);
            border-color: var(--purple-neon);
            transform: translateX(-5px);
            box-shadow: 0 5px 20px rgba(165, 94, 234, 0.4);
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, var(--purple-neon), #ffffff, var(--pink-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        p.subtitle {
            color: var(--text-sub);
            margin-bottom: 25px;
            font-size: 1.05rem;
        }

        /* Barre d'informations */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 25px;
            border-radius: 50px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            font-size: 0.95rem;
        }

        .stat-val {
            font-weight: 900;
            color: var(--purple-neon);
        }

        /* Carte de Jeu */
        .quiz-card {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 35px 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        .question-category {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(165, 94, 234, 0.2);
            color: var(--purple-neon);
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 30px;
            line-height: 1.4;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Grille des réponses */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        .opt-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: white;
            padding: 16px;
            border-radius: 16px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
        }

        .opt-btn:hover {
            background: rgba(165, 94, 234, 0.2);
            border-color: var(--purple-neon);
            transform: translateY(-3px);
        }

        .opt-btn.correct {
            background: rgba(46, 213, 115, 0.3) !important;
            border-color: var(--green-neon) !important;
            color: var(--green-neon) !important;
        }

        .opt-btn.wrong {
            background: rgba(255, 71, 87, 0.3) !important;
            border-color: var(--pink-neon) !important;
            color: var(--pink-neon) !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-button">← Retour à l'accueil</a>

        <h1>Devine l'Animé ! 🧠</h1>
        <p class="subtitle">Mode Hardcore Infini 💀 — Réservé aux vrais experts du genre !</p>

        <div class="stats-bar">
            <div>Score : <span id="scoreVal" class="stat-val">0</span></div>
            <div>Questions : <span id="qCount" class="stat-val">0</span></div>
            <div>Série : <span id="streakVal" class="stat-val">0 🔥</span></div>
        </div>

        <div class="quiz-card" id="quizCard">
            <span id="qCategory" class="question-category">Chargement...</span>
            <div id="qText" class="question-text">Chargement de la question...</div>

            <div class="options-grid" id="optionsGrid">
                </div>
        </div>
    </div>

    <script>
        /* ==============================================
           BANQUE DE QUESTIONS OTAKU - NIVEAU EXPERT / HARDCORE
        ============================================== */
        const questionsDatabase = [
            {
                type: "Lore Profond 📚",
                question: "Dans Hunter x Hunter, quel est le numéro du badge de Hisoka lors du 287ème examen de Hunter ?",
                options: ["N° 44", "N° 191", "N° 403", "N° 99"],
                answer: 0
            },
            {
                type: "Détail Technique ⚡",
                question: "Dans Jujutsu Kaisen, à quelle vitesse la technique de projection de Naobito Zen'in découpe-t-elle une seconde ?",
                options: ["12 images/sec", "24 images/sec", "60 images/sec", "120 images/sec"],
                answer: 1
            },
            {
                type: "Lore Obscur 💀",
                question: "Dans Attack on Titan, qui était le détenteur du Titan Assaillant juste avant Grisha Jaeger ?",
                options: ["Ymir Fritz", "Eren Kruger", "Uri Reiss", "Xaver"],
                answer: 1
            },
            {
                type: "Steins;Gate ⏳",
                question: "Quelle est la valeur exacte du Divergence Meter nécessaire pour atteindre la ligne d'univers Steins Gate ?",
                options: ["1.048596%", "0.571024%", "1.130426%", "0.000000%"],
                answer: 0
            },
            {
                type: "Bleach 🗡️",
                question: "Quel numéro prend l'Espada Yammy Llargo lorsque sa forme 'Ira' est complètement libérée ?",
                options: ["N° 10", "N° 1", "N° 0", "N° 9"],
                answer: 2
            },
            {
                type: "One Piece 🏴‍☠️",
                question: "Comment s'appelle le sabre de classe Meito (Meiyo) confié à Zoro par Hiyori au pays de Wano ?",
                options: ["Shusui", "Enma", "Wado Ichimonji", "Sandai Kitetsu"],
                answer: 1
            },
            {
                type: "Death Note 📓",
                question: "Quel est le nom du Shinigami qui s'est sacrifié par amour pour sauver Misa Aane ?",
                options: ["Gelus (Jealous)", "Rem", "Sidoh", "Midora"],
                answer: 0
            },
            {
                type: "Fullmetal Alchemist ⚗️",
                question: "Quel nom portait 'Le Père' lorsqu'il était retenu dans sa fiole à Cserkess ?",
                options: ["Homunculus", "Enfant de la fiole", "Nouveau Dieu", "Dwarf in the Flask (Homunculus)"],
                answer: 3
            },
            {
                type: "Chainsaw Man 🪚",
                question: "Quel est le nom du démon qui contracte avec Aki Hayakawa en échange d'une partie de son espérance de vie ?",
                options: ["Démon Renard", "Démon Malédiction", "Démon Futur", "Démon Flingue"],
                answer: 2
            },
            {
                type: "Chiffre Exact 🔢",
                question: "Dans la Saison 1 de Re:Zero, combien de fois Subaru meurt-il au total ?",
                options: ["7 fois", "11 fois", "15 fois", "18 fois"],
                answer: 1
            },
            {
                type: "Demon Slayer 👺",
                question: "Quel est le nom du créateur du premier Souffle (Souffle du Soleil / Hinokami Kagura) ?",
                options: ["Yoriichi Tsugikuni", "Michikatsu Tsugikuni", "Sumiyoshi", "Tanjuro Kamado"],
                answer: 0
            },
            {
                type: "Naruto Shippuden 🌀",
                question: "Quel est le vrai nom du Démon à Quatre Queues (Yonbi) scellé dans Rôshi ?",
                options: ["Isobu", "Son Gokū", "Kokuō", "Saiken"],
                answer: 1
            },
            {
                type: "Code Geass 👁️",
                question: "Quel est le nom du mécha personnalisé piloted par Suzaku Kururugi ?",
                options: ["Gawain", "Lancelot", "Guren Mk-II", "Shen Hu"],
                answer: 1
            },
            {
                type: "Berserk 🗡️",
                question: "Quel est le nom de la troupe de mercenaires dirigée par Griffith avant l'Éclipse ?",
                options: ["La Brigade des Ombres", "La Troupe du Falcon (Bande du Griffon)", "Les Chevaliers Noirs", "La Lame de Dieu"],
                answer: 1
            },
            {
                type: "JoJo's Bizarre Adventure ⭐️",
                question: "Dans la partie 5 (Golden Wind), quel est le nom du Stand de Bruno Bucciarati ?",
                options: ["Gold Experience", "Sticky Fingers", "Moody Blues", "Purple Haze"],
                answer: 1
            }
        ];

        let questionsAnswered = 0;
        let score = 0;
        let streak = 0;
        let pool = [];
        let currentQuestion = null;
        let canAnswer = true;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(isCorrect) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';

                if (isCorrect) {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
                } else {
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.2);
                }

                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch(e){}
        }

        // Tirage aléatoire sans répétition immédiate
        function getNextQuestion() {
            if (pool.length === 0) {
                pool = [...questionsDatabase].sort(() => Math.random() - 0.5);
            }
            return pool.pop();
        }

        function loadQuestion() {
            canAnswer = true;
            currentQuestion = getNextQuestion();

            document.getElementById("qCategory").innerText = currentQuestion.type;
            document.getElementById("qText").innerText = currentQuestion.question;
            
            const grid = document.getElementById("optionsGrid");
            grid.innerHTML = "";

            currentQuestion.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "opt-btn";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(selectedIdx, btnElement) {
            if (!canAnswer) return;
            canAnswer = false;

            const buttons = document.querySelectorAll(".opt-btn");
            questionsAnswered++;

            if (selectedIdx === currentQuestion.answer) {
                btnElement.classList.add("correct");
                score += 150 + (streak * 30); // Plus de points en mode Hardcore !
                streak++;
                playSound(true);
            } else {
                btnElement.classList.add("wrong");
                buttons[currentQuestion.answer].classList.add("correct");
                streak = 0;
                playSound(false);
            }

            updateStats();

            setTimeout(() => {
                loadQuestion();
            }, 1200);
        }

        function updateStats() {
            document.getElementById("scoreVal").innerText = score;
            document.getElementById("qCount").innerText = questionsAnswered;
            document.getElementById("streakVal").innerText = `${streak} 🔥`;
        }

        // Lancement initial
        loadQuestion();
    </script>
</body>
</html>
