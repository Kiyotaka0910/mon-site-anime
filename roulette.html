<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette Anime & Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0f111a;
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        /* Bouton Retour */
        .back-button {
            display: inline-flex;
            align-items: center;
            margin-bottom: 25px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #2e90ff;
            border-color: #2e90ff;
            transform: translateX(-5px);
            box-shadow: 0 4px 15px rgba(46, 144, 255, 0.4);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        p {
            color: #a4b0be;
            margin-bottom: 30px;
        }

        /* Sélecteur de catégorie */
        .category-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .cat-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cat-btn.active, .cat-btn:hover {
            background: #2e90ff;
            border-color: #2e90ff;
            box-shadow: 0 4px 15px rgba(46, 144, 255, 0.4);
        }

        /* Zone de la roulette */
        .wheel-wrapper {
            position: relative;
            display: inline-block;
            margin: 20px 0;
        }

        /* Curseur / Flèche */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 30px solid #ff4757;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 0 8px rgba(255, 255, 255, 0.05);
            max-width: 100%;
            height: auto;
        }

        /* Bouton Lancer */
        .spin-btn {
            display: block;
            margin: 30px auto 0;
            background: linear-gradient(135deg, #2ed573, #1e90ff);
            color: white;
            border: none;
            padding: 15px 40px;
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 6px 20px rgba(46, 213, 115, 0.3);
        }

        .spin-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(46, 213, 115, 0.5);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Popup résultat (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #141621;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-content h3 {
            color: #a4b0be;
            margin-top: 0;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-text {
            font-size: 1.6rem;
            font-weight: 800;
            color: #2e90ff;
            margin: 20px 0;
        }

        .close-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: #ff6b81;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-button">← Retour à l'accueil</a>

        <h1>La Roulette Anime</h1>
        <p>Tu ne sais pas quoi regarder ou écouter ? Laisse le hasard décider !</p>

        <div class="category-selector">
            <button class="cat-btn active" onclick="changeCategory('animes')">📺 Animés</button>
            <button class="cat-btn" onclick="changeCategory('openings')">🎵 Openings</button>
            <button class="cat-btn" onclick="changeCategory('endings')">🎶 Endings</button>
        </div>

        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="450" height="450"></canvas>
        </div>

        <button id="spinBtn" class="spin-btn" onclick="spin()">Lancer la roulette !</button>
    </div>

    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h3>Le destin a parlé !</h3>
            <div id="resultText" class="result-text">...</div>
            <button class="close-btn" onclick="closeModal()">Fermer</button>
        </div>
    </div>

    <script>
        // Banques de données pour la roulette
        const datasets = {
            animes: [
                "Jujutsu Kaisen", "Attack on Titan", "Hunter x Hunter", 
                "Chainsaw Man", "Demon Slayer", "Naruto", 
                "Death Note", "Fullmetal Alchemist", "One Piece", 
                "Bleach", "Spy x Family", "Vinland Saga"
            ],
            openings: [
                "JJK - Kaikai Kitan", "SnK - Shinzou wo Sasageyo", 
                "HxH - Departure!", "CSM - Kick Back", 
                "Demon Slayer - Gurenge", "Naruto - Blue Bird", 
                "Death Note - The World", "FMA:B - Again"
            ],
            endings: [
                "JJK - Lost in Paradise", "SnK - Akuma no Ko", 
                "HxH - Hyori Ittai", "CSM - Hawatari Nioku Centi", 
                "Demon Slayer - Asa ga Kuru", "Naruto - Wind", 
                "Bleach - Life is Like a Boat", "JoJo - Roundabout"
            ]
        };

        // Palette de couleurs pour la roue
        const colors = [
            "#ff4757", "#2e90ff", "#2ed573", "#ffa801", 
            "#9b59b6", "#1abc9c", "#e84393", "#e67e22"
        ];

        let currentCategory = 'animes';
        let items = datasets[currentCategory];

        const canvas = document.getElementById("wheelCanvas");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spinBtn");

        let startAngle = 0;
        let spinTimeout = null;
        let spinAngleStart = 10;
        let spinTime = 0;
        let spinTimeTotal = 0;

        // Dessiner la roue
        function drawWheel() {
            const numOptions = items.length;
            const arcSize = (2 * Math.PI) / numOptions;
            const outsideRadius = 200;
            const textRadius = 140;
            const insideRadius = 40;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 2;

            for (let i = 0; i < numOptions; i++) {
                const angle = startAngle + i * arcSize;
                ctx.fillStyle = colors[i % colors.length];

                ctx.beginPath();
                ctx.arc(225, 225, outsideRadius, angle, angle + arcSize, false);
                ctx.arc(225, 225, insideRadius, angle + arcSize, angle, true);
                ctx.stroke();
                ctx.fill();

                ctx.save();
                ctx.shadowColor = "rgba(0,0,0,0.5)";
                ctx.shadowBlur = 4;
                ctx.fillStyle = "white";
                ctx.font = "bold 13px Poppins, sans-serif";

                // Positionnement du texte
                const textAngle = angle + arcSize / 2;
                ctx.translate(
                    225 + Math.cos(textAngle) * textRadius,
                    225 + Math.sin(textAngle) * textRadius
                );
                ctx.rotate(textAngle + Math.PI / 2);
                
                const text = items[i];
                // Troncature du texte si trop long
                const formattedText = text.length > 18 ? text.substring(0, 16) + "..." : text;
                ctx.fillText(formattedText, -ctx.measureText(formattedText).width / 2, 0);
                
                ctx.restore();
            }
        }

        // Changement de catégorie
        function changeCategory(cat) {
            currentCategory = cat;
            items = datasets[cat];
            
            // Mise à jour visuelle des boutons
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            startAngle = 0;
            drawWheel();
        }

        // Lancer la roulette
        function spin() {
            spinAngleStart = Math.random() * 10 + 10;
            spinTime = 0;
            spinTimeTotal = Math.random() * 3000 + 4000; // Durée entre 4 et 7 sec
            spinBtn.disabled = true;
            rotateWheel();
        }

        // Animation de rotation
        function rotateWheel() {
            spinTime += 30;
            if (spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        // Arrêt de la roue et affichage du résultat
        function stopRotateWheel() {
            clearTimeout(spinTimeout);
            const numOptions = items.length;
            const arcSize = (2 * Math.PI) / numOptions;
            
            // Calcul de l'index pointé par le curseur du haut (270° ou 3*PI/2)
            let degrees = startAngle * 180 / Math.PI + 90;
            let arcd = arcSize * 180 / Math.PI;
            let index = Math.floor((360 - (degrees % 360)) / arcd);
            index = (index + numOptions) % numOptions;

            showResult(items[index]);
            spinBtn.disabled = false;
        }

        // Fonction de décélération fluide (Easing)
        function easeOut(t, b, c, d) {
            const ts = (t /= d) * t;
            const tc = ts * t;
            return b + c * (tc + -3 * ts + 3 * t);
        }

        // Affichage de la modal
        function showResult(text) {
            document.getElementById("resultText").innerText = text;
            document.getElementById("resultModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("resultModal").style.display = "none";
        }

        // Premier dessin au chargement
        drawWheel();
    </script>
</body>
</html>
