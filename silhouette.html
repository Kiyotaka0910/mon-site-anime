<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Silhouette - Otaku Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        .game-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            text-align: center;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            margin-bottom: 20px;
            color: var(--text-main, #ffffff);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.06);
            padding: 10px 22px;
            border-radius: 50px;
            border: 1px solid var(--card-border, rgba(255, 255, 255, 0.1));
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .back-button:hover {
            background: var(--blue-neon, #00d2ff);
            border-color: var(--blue-neon, #00d2ff);
            color: #ffffff;
            transform: translateX(-5px);
        }

        /* Tableau des scores */
        .score-board {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .score-card {
            background: var(--panel-bg, rgba(15, 15, 25, 0.8));
            border: 1px solid var(--card-border, rgba(255, 255, 255, 0.1));
            padding: 10px 25px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-main, #ffffff);
        }

        .score-card span {
            color: var(--blue-neon, #00d2ff);
            font-size: 1.1rem;
        }

        /* Zone d'affichage de la silhouette */
        .silhouette-box {
            background: var(--panel-bg, rgba(15, 15, 25, 0.8));
            border: 1px solid var(--card-border, rgba(255, 255, 255, 0.1));
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 320px;
            position: relative;
            overflow: hidden;
        }

        .character-img {
            max-height: 250px;
            max-width: 100%;
            object-fit: contain;
            /* Transformation en silhouette noire */
            filter: brightness(0) drop-shadow(0 5px 15px rgba(0,0,0,0.8));
            transition: filter 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s ease;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Classe appliquée lors du dévoilement de la réponse */
        .character-img.revealed {
            filter: brightness(1) drop-shadow(0 0 20px var(--blue-neon, #00d2ff));
            transform: scale(1.05);
        }

        .anime-hint {
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-sub, #aaaaaa);
            font-weight: 600;
        }

        /* Grille des boutons de choix */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: var(--panel-bg, rgba(15, 15, 25, 0.8));
            border: 1px solid var(--card-border, rgba(255, 255, 255, 0.1));
            color: var(--text-main, #ffffff);
            padding: 16px 20px;
            border-radius: 16px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
            text-align: center;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            border-color: var(--blue-neon, #00d2ff);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        /* Réponses Vrai / Faux */
        .option-btn.correct {
            background: #2ed573 !important;
            border-color: #2ed573 !important;
            color: #ffffff !important;
            box-shadow: 0 0 20px rgba(46, 213, 115, 0.5);
        }

        .option-btn.wrong {
            background: #ff4757 !important;
            border-color: #ff4757 !important;
            color: #ffffff !important;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
        }

        .next-btn {
            background: var(--blue-neon, #00d2ff);
            border: none;
            color: #ffffff;
            padding: 14px 35px;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
            margin: 0 auto;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        }

        .next-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.15);
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        /* FONCTION POUR DÉTERMINER L'ANIME EN FONCTION DE L'ID */
        function getAnimeName(id) {
            if (id >= 1 && id <= 30) return "One Piece";
            if (id >= 31 && id <= 75) return "Naruto";
            if (id >= 76 && id <= 105) return "Dragon Ball";
            if (id >= 106 && id <= 135) return "L'Attaque des Titans";
            if (id >= 136 && id <= 164) return "Jujutsu Kaisen";
            if (id >= 165 && id <= 195) return "Demon Slayer";
            if (id >= 196 && id <= 229) return "My Hero Academia";
            if (id >= 230 && id <= 260) return "Hunter x Hunter";
            if (id >= 261 && id <= 295) return "Bleach";
            if (id >= 296 && id <= 305) return "Death Note";
            if (id >= 306 && id <= 320) return "Fullmetal Alchemist";
            if (id >= 321 && id <= 355) return "Blue Lock";
            if (id >= 356 && id <= 385) return "Kuroko no Basket";
            if (id >= 386 && id <= 414) return "Classroom of the Elite";
            if (id >= 415 && id <= 443) return "Fire Force";
            if (id >= 444 && id <= 468) return "Haikyu!!";
            if (id === 469) return "Tokyo Ghoul";
            if (id >= 470 && id <= 496) return "Solo Leveling";
            return "Autres Séries";
        }

        /* BASE DE DONNÉES DE 500 PERSOS */
        const charactersDatabase = Object.keys(rawCharacters).map(id => {
            const numId = parseInt(id);
            return {
                id: numId,
                name: rawCharacters[numId],
                anime: getAnimeName(numId),
                img: `images/${numId}.jpg`
            };
        });

        const allNames = charactersDatabase.map(c => c.name);

        let currentCharacter = null;
        let score = 0;
        let streak = 0;
        let isAnswered = false;

        function loadNextCharacter() {
            isAnswered = false;
            document.getElementById('nextBtn').style.display = 'none';

            const charImg = document.getElementById('charImage');
            charImg.classList.remove('revealed');

            // Tirage aléatoire
            currentCharacter = charactersDatabase[Math.floor(Math.random() * charactersDatabase.length)];
            
            charImg.src = currentCharacter.img;
            document.getElementById('animeHint').innerText = `Origine : ${currentCharacter.anime}`;

            // Génération des 4 choix
            let options = [currentCharacter.name];
            while (options.length < 4) {
                let randomName = allNames[Math.floor(Math.random() * allNames.length)];
                if (!options.includes(randomName)) {
                    options.push(randomName);
                }
            }

            options.sort(() => Math.random() - 0.5);

            // Affichage des boutons
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';

            options.forEach(name => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = name;
                btn.onclick = () => handleChoice(btn, name);
                grid.appendChild(btn);
            });
        }

        function handleChoice(selectedBtn, chosenName) {
            if (isAnswered) return;
            isAnswered = true;

            const charImg = document.getElementById('charImage');
            charImg.classList.add('revealed');

            const allButtons = document.querySelectorAll('.option-btn');

            if (chosenName === currentCharacter.name) {
                selectedBtn.classList.add('correct');
                score += 100;
                streak++;
            } else {
                selectedBtn.classList.add('wrong');
                streak = 0;

                allButtons.forEach(btn => {
                    if (btn.innerText === currentCharacter.name) {
                        btn.classList.add('correct');
                    }
                });
            }

            allButtons.forEach(btn => btn.disabled = true);

            document.getElementById('scoreText').innerText = score;
            document.getElementById('streakText').innerText = `🔥 ${streak}`;

            document.getElementById('nextBtn').style.display = 'block';
        }

        // Chargement du thème
        (function initTheme() {
            const savedTheme = localStorage.getItem('otaku_theme') || 'cyber';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();

        loadNextCharacter();
    </script>
</body>
</html>
