<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face-à-Face - Otaku Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #06070c;
            --panel-bg: rgba(18, 20, 32, 0.85);
            --blue-neon: #2e90ff;
            --pink-neon: #ff4757;
            --text-main: #ffffff;
            --text-sub: #a4b0be;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(46, 144, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 71, 87, 0.15) 0%, transparent 40%);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
            text-align: center;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            margin-bottom: 20px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.06);
            padding: 10px 22px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .back-button:hover {
            background: var(--blue-neon);
            border-color: var(--blue-neon);
            transform: translateX(-5px);
            box-shadow: 0 5px 20px rgba(46, 144, 255, 0.4);
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, var(--blue-neon), #ffffff, var(--pink-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        p.subtitle {
            color: var(--text-sub);
            margin-bottom: 25px;
            font-size: 1.05rem;
        }

        .category-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .cat-btn {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            padding: 12px 24px;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cat-btn:hover {
            color: white;
            border-color: var(--blue-neon);
            transform: translateY(-2px);
        }

        .cat-btn.active {
            background: linear-gradient(135deg, var(--blue-neon), var(--pink-neon));
            color: white;
            border: none;
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.35);
            transform: translateY(-2px);
        }

        .info-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .streak-board, .pool-board {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        .highlight-val {
            font-weight: 900;
            color: #2ed573;
        }

        .arena {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            position: relative;
            flex-wrap: wrap;
            transition: opacity 0.2s ease;
        }

        .vs-card {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px 25px;
            width: 320px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .card-left {
            border: 2px solid rgba(46, 144, 255, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .card-left:hover {
            border-color: var(--blue-neon);
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 45px rgba(46, 144, 255, 0.4);
        }

        .card-right {
            border: 2px solid rgba(255, 71, 87, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .card-right:hover {
            border-color: var(--pink-neon);
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 45px rgba(255, 71, 87, 0.4);
        }

        .badge-role {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        .card-left .badge-role {
            background: rgba(46, 144, 255, 0.2);
            color: var(--blue-neon);
        }

        .card-right .badge-role {
            background: rgba(255, 71, 87, 0.2);
            color: var(--pink-neon);
        }

        .item-name {
            font-size: 1.4rem;
            font-weight: 800;
            line-height: 1.3;
            margin: 15px 0;
            color: #ffffff;
            word-break: break-word;
        }

        .vote-btn {
            width: 100%;
            padding: 12px;
            border-radius: 50px;
            border: none;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-left .vote-btn {
            background: linear-gradient(135deg, var(--blue-neon), #1b539c);
            color: white;
            box-shadow: 0 5px 15px rgba(46, 144, 255, 0.3);
        }

        .card-right .vote-btn {
            background: linear-gradient(135deg, var(--pink-neon), #c0392b);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);
        }

        .vs-badge {
            font-size: 2.2rem;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(135deg, var(--blue-neon), var(--pink-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 15px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background-color: var(--panel-bg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            animation: pulseVS 2s infinite alternate;
            z-index: 10;
        }

        @keyframes pulseVS {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(46, 144, 255, 0.3); }
            100% { transform: scale(1.1); box-shadow: 0 0 25px rgba(255, 71, 87, 0.5); }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-button">← Retour à l'accueil</a>

        <h1>Face-à-Face 🥊</h1>
        <p class="subtitle">Des centaines de duels uniques. Choisis ton favori pour le faire régner !</p>

        <div class="category-selector">
            <button class="cat-btn active" onclick="setCategory('personnages', this)">👤 Personnages</button>
            <button class="cat-btn" onclick="setCategory('openings', this)">🎵 Openings</button>
            <button class="cat-btn" onclick="setCategory('endings', this)">🎶 Endings</button>
            <button class="cat-btn" onclick="setCategory('osts', this)">⚡ OSTs</button>
            <button class="cat-btn" onclick="setCategory('animes', this)">📺 Animés</button>
        </div>

        <div class="info-bar">
            <div class="streak-board">
                Série du Champion : <span id="streakCount" class="highlight-val">0 victoires</span>
            </div>
            <div class="pool-board">
                Restants en réserve : <span id="poolCount" class="highlight-val">0</span>
            </div>
        </div>

        <div class="arena">
            <div class="vs-card card-left" onclick="vote(0)">
                <span class="badge-role">👑 Champion en titre</span>
                <div id="leftName" class="item-name">...</div>
                <button class="vote-btn">Garder ce favori</button>
            </div>

            <div class="vs-badge">VS</div>

            <div class="vs-card card-right" onclick="vote(1)">
                <span class="badge-role">⚔️ Challenger</span>
                <div id="rightName" class="item-name">...</div>
                <button class="vote-btn">Élire ce challenger</button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================
           BANQUE DE DONNÉES MASSIF (Extension Personnages & Animés)
        ========================================================= */
        const rawDatasets = {
            personnages: [
                "Gojo Satoru (JJK)", "Sukuna (JJK)", "Yuji Itadori (JJK)", "Megumi Fushiguro (JJK)", "Toji Fushiguro (JJK)", "Yuta Okkotsu (JJK)",
                "Eren Jaeger (SnK)", "Levi Ackerman (SnK)", "Mikasa Ackerman (SnK)", "Erwin Smith (SnK)", "Armin Arlert (SnK)", "Reiner Braun (SnK)",
                "Killua Zoldyck (HxH)", "Gon Freecss (HxH)", "Hisoka Morow (HxH)", "Chrollo Lucilfer (HxH)", "Meruem (HxH)", "Kurapika (HxH)",
                "Denji (Chainsaw Man)", "Makima (Chainsaw Man)", "Power (Chainsaw Man)", "Aki Hayakawa (Chainsaw Man)", "Reze (Chainsaw Man)",
                "Tanjiro Kamado (Demon Slayer)", "Nezuko Kamado (Demon Slayer)", "Zenitsu Agatsuma (Demon Slayer)", "Rengoku Kyojuro (Demon Slayer)", "Giyu Tomioka (Demon Slayer)", "Akaza (Demon Slayer)",
                "Naruto Uzumaki (Naruto)", "Sasuke Uchiha (Naruto)", "Kakashi Hatake (Naruto)", "Itachi Uchiha (Naruto)", "Madara Uchiha (Naruto)", "Jiraiya (Naruto)",
                "Light Yagami (Death Note)", "L Lawliet (Death Note)", "Ryuk (Death Note)",
                "Edward Elric (FMA)", "Roy Mustang (FMA)", "Alphonse Elric (FMA)", "King Bradley (FMA)",
                "Monkey D. Luffy (One Piece)", "Roronoa Zoro (One Piece)", "Sanji (One Piece)", "Trafalgar Law (One Piece)", "Shanks (One Piece)", "Ace (One Piece)",
                "Ichigo Kurosaki (Bleach)", "Aizen Sousuke (Bleach)", "Kisuke Urahara (Bleach)", "Kenpachi Zaraki (Bleach)", "Byakuya Kuchiki (Bleach)",
                "Sung Jinwoo (Solo Leveling)", "Cha Hae-In (Solo Leveling)", "Saitama (One Punch Man)", "Garou (One Punch Man)", "Genos (One Punch Man)",
                "Guts (Berserk)", "Griffith (Berserk)", "Ken Kaneki (Tokyo Ghoul)", "Lelouch vi Britannia (Code Geass)", "C.C. (Code Geass)",
                "Thorfinn (Vinland Saga)", "Askeladd (Vinland Saga)", "Mob / Shigeo (Mob Psycho 100)", "Reigen Arataka (Mob Psycho 100)",
                "Izuku Midoriya (MHA)", "Katsuki Bakugo (MHA)", "Shoto Todoroki (MHA)", "All Might (MHA)", "Hawks (MHA)",
                "Loid Forger (Spy x Family)", "Anya Forger (Spy x Family)", "Yor Forger (Spy x Family)", "Rintarou Okabe (Steins;Gate)", "Kurisu Makise (Steins;Gate)",
                "Subaru Natsuki (Re:Zero)", "Rem (Re:Zero)", "Emilia (Re:Zero)", "Asta (Black Clover)", "Yami Sukehiro (Black Clover)"
            ],
            openings: [
                "JJK OP 1 - Kaikai Kitan", "JJK OP 2 - Specialz", "JJK OP 3 - Where Our Blue Is",
                "SnK OP 1 - Guren no Yumiya", "SnK OP 2 - Shinzou wo Sasageyo", "SnK OP 3 - Red Swan", "SnK OP 5 - The Rumbling",
                "HxH OP 1 - Departure!", "CSM OP 1 - Kick Back", "Demon Slayer OP 1 - Gurenge", "Demon Slayer OP 3 - Zankyo Sanka",
                "Naruto OP 2 - Distance", "Naruto OP 3 - Blue Bird", "Naruto OP 16 - Silhouette",
                "Death Note OP 1 - The World", "Death Note OP 2 - What's up, people?!",
                "FMA:B OP 1 - Again", "FMA:B OP 5 - Rain", "One Piece OP 1 - We Are!", "One Piece OP 14 - Fight Together", "One Piece OP 25 - Peak",
                "Bleach OP 1 - Asterisk", "Bleach OP 13 - Ranbu no Meroii", "Bleach TYBW OP 1 - Scar",
                "Spy x Family OP 1 - Mixed Nuts", "JoJo OP 2 - Bloody Stream", "JoJo OP 8 - Fighting Gold",
                "Tokyo Ghoul OP 1 - Unravel", "MHA OP 1 - The Day", "MHA OP 3 - Peace Sign", "Code Geass OP 1 - Colors",
                "Vinland Saga OP 1 - Mukanjyo", "Mob Psycho OP 1 - 99", "Fire Force OP 1 - Inferno", "Blue Lock OP 1 - Chaos Ga Kiwamarutoki",
                "Solo Leveling OP 1 - LEvE-L", "Black Clover OP 3 - Black Rover", "Black Clover OP 10 - Black Catcher", "Oshi no Ko OP 1 - Idol"
            ],
            endings: [
                "JJK ED 1 - Lost in Paradise", "JJK ED 2 - Give it Back", "SnK ED 1 - Utsukushiki Zankoku na Sekai", "SnK ED 7 - Akuma no Ko",
                "HxH ED 1 - Just Awake", "HxH ED 5 - Hyori Ittai", "CSM ED 3 - Hawatari Nioku Centi", "CSM ED 8 - First Death",
                "Demon Slayer ED 1 - from the edge", "Demon Slayer ED 2 - Asa ga Kuru", "Naruto ED 1 - Wind", "Naruto Shippuden ED 15 - U can do it!",
                "Death Note ED 1 - Alumina", "FMA:B ED 1 - Uso", "FMA:B ED 4 - Shunkan Sentimental", "One Piece ED 1 - Memories",
                "Bleach ED 1 - Life is Like a Boat", "My Hero Academia ED 3 - Datte Atashi no Hero", "Spy x Family ED 1 - Comedy",
                "Kaguya-sama ED 2 - Chika Dance", "JoJo ED 1 - Roundabout", "Tokyo Ghoul ED 1 - Kisetsu wa TsugiTsugi Shindeiku",
                "Vinland Saga ED 1 - Torches", "Fire Force ED 1 - veil", "Haikyu!! ED 1 - Leo", "Re:Zero ED 1 - STYX HELIX"
            ],
            osts: [
                "JJK - Hollow Purple Theme", "JJK - Sukuna Domain Expansion", "SnK - YouSeeBIGGIRL / T:T", "SnK - Vogel im Käfig", "SnK - Ashes on The Fire",
                "HxH - Kingdom of Predators", "HxH - Hisoka Theme", "CSM - Edge of Chainsaw", "Demon Slayer - Kamado Tanjiro no Uta",
                "Naruto - Girei (Pain Theme)", "Naruto - Sadness and Sorrow", "Death Note - L's Theme", "FMA:B - Bratja (Brothers)",
                "One Piece - Drums of Liberation", "One Piece - Overtaken", "Bleach - Number One", "Bleach - Treachery (Aizen Theme)",
                "MHA - You Say Run", "JoJo - Giorno's Theme (Il vento d'oro)", "Dragon Ball Super - Ultimate Battle", "SAO - Swordland",
                "Berserk - Guts Theme", "Kill la Kill - Don't Lose Your Way", "Steins;Gate - Gate of Steiner"
            ],
            animes: [
                "Jujutsu Kaisen", "Attack on Titan (SnK)", "Hunter x Hunter", "Chainsaw Man", "Demon Slayer", "Naruto Shippuden",
                "Death Note", "Fullmetal Alchemist: Brotherhood", "One Piece", "Bleach", "Solo Leveling", "One Punch Man",
                "Berserk", "Tokyo Ghoul", "Code Geass", "Vinland Saga", "Mob Psycho 100", "My Hero Academia", "Spy x Family",
                "Steins;Gate", "Re:Zero", "Black Clover", "Haikyu!!", "Blue Lock", "Cyberpunk: Edgerunners", "Monster",
                "Neon Genesis Evangelion", "JoJo's Bizarre Adventure", "Dragon Ball Z", "Sword Art Online", "Fate/Zero"
            ]
        };

        /* =========================================================
           MOTEUR ANTI-RÉPÉTITION & GESTION DES RÉSERVES
        ========================================================= */
        let currentCategory = 'personnages';
        let availablePool = [];
        let usedItems = new Set();
        
        let champion = "";
        let challenger = "";
        let streak = 0;

        const leftNameElem = document.getElementById("leftName");
        const rightNameElem = document.getElementById("rightName");
        const streakElem = document.getElementById("streakCount");
        const poolElem = document.getElementById("poolCount");

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSelectSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e){}
        }

        // Récupère un élément unique de la réserve
        function getNextFromPool() {
            if (availablePool.length === 0) {
                // Réinitialise la réserve si tous les éléments ont été joués !
                availablePool = [...rawDatasets[currentCategory]];
                // Mélange aléatoire (Fisher-Yates)
                for (let i = availablePool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [availablePool[i], availablePool[j]] = [availablePool[j], availablePool[i]];
                }
            }
            return availablePool.pop();
        }

        function initArena() {
            availablePool = [];
            usedItems.clear();
            
            champion = getNextFromPool();
            challenger = getNextFromPool();
            streak = 0;
            
            updateUI();
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            initArena();
        }

        function vote(index) {
            playSelectSound();

            if (index === 0) {
                // Le Champion gagne
                streak++;
            } else {
                // Le Challenger prend la place de Champion !
                champion = challenger;
                streak = 1;
            }

            // Pioche le prochain Challenger de manière garantie unique
            challenger = getNextFromPool();

            // Transition visuelle douce
            const arena = document.querySelector('.arena');
            arena.style.opacity = '0.3';
            setTimeout(() => {
                updateUI();
                arena.style.opacity = '1';
            }, 120);
        }

        function updateUI() {
            leftNameElem.innerText = champion;
            rightNameElem.innerText = challenger;
            streakElem.innerText = `${streak} victoire(s)`;
            poolElem.innerText = `${availablePool.length} éléments`;
        }

        // Lancement initial
        initArena();
    </script>
</body>
</html>
